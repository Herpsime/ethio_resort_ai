<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>My Profile | Ethio Resort AI</title>

    <link rel="stylesheet" href="style.css" />

    <style>
      .profile-container {
        max-width: 1100px;
        margin: auto;
        padding: 30px 20px;
      }

      /* HEADER */
      .profile-header {
        text-align: center;
        margin-bottom: 30px;
      }

      .profile-header h1 {
        color: #1a6b44;
      }

      /* PROFILE CARD */
      .profile-card {
        display: flex;
        gap: 20px;
        background: #fff;
        padding: 20px;
        border-radius: 20px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        align-items: center;
        margin-bottom: 30px;
      }

      .profile-img {
        width: 90px;
        height: 90px;
        border-radius: 50%;
        background: #ccc;
      }

      .profile-info h3 {
        margin: 0;
      }

      .profile-info p {
        color: #555;
        font-size: 0.9rem;
      }

      /* BOOKINGS */
      .bookings-section {
        background: #fff;
        padding: 20px;
        border-radius: 20px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      }

      .booking-card {
        border-bottom: 1px solid #eee;
        padding: 12px 0;
      }

      .booking-card:last-child {
        border-bottom: none;
      }

      .status {
        font-size: 0.8rem;
        padding: 4px 10px;
        border-radius: 10px;
        display: inline-block;
        margin-top: 5px;
      }

      .confirmed {
        background: #d4f8e8;
        color: #1a6b44;
      }

      .pending {
        background: #fff3cd;
        color: #856404;
      }

      .cancel-btn {
        margin-top: 6px;
        padding: 6px 10px;
        border: none;
        background: #c0392b;
        color: white;
        border-radius: 8px;
        cursor: pointer;
        font-size: 0.8rem;
      }

      .cancel-btn:hover {
        background: #922b21;
      }

      /* EDIT BUTTON */
      .edit-btn {
        margin-top: 10px;
        padding: 8px 15px;
        border: none;
        background: #1f6e43;
        color: white;
        border-radius: 10px;
        cursor: pointer;
      }

      .edit-btn:hover {
        background: #145c3b;
      }
    </style>
  </head>

  <body>
    <div class="profile-container">
      <!-- HEADER -->
      <div class="profile-header">
        <h1>👤 My Profile</h1>
        <p>Manage your account & bookings</p>
      </div>

      <!-- PROFILE INFO -->
      <div class="profile-card">
        <div class="profile-img"></div>

        <div class="profile-info">
          <h3 id="userName">Rahel Getachew</h3>
          <p id="userEmail">rahel@email.com</p>
          <p>📞 0940804589</p>

          <button class="edit-btn">Edit Profile</button>
        </div>
      </div>

      <!-- BOOKINGS -->
      <div class="bookings-section">
        <h2>📅 My Bookings</h2>

        <div id="bookingList">
          <!-- Booking 1 -->
          <div class="booking-card">
            <strong>Deluxe Room</strong><br />
            Check-in: April 10 | Nights: 2<br />
            <span class="status confirmed">Confirmed</span><br />
            <button class="cancel-btn">Cancel</button>
          </div>

          <!-- Booking 2 -->
          <div class="booking-card">
            <strong>Lake View Suite</strong><br />
            Check-in: April 18 | Nights: 3<br />
            <span class="status pending">Pending</span><br />
            <button class="cancel-btn">Cancel</button>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js" defer></script>

    <script>
      // Cancel booking interaction
      document.querySelectorAll(".cancel-btn").forEach((btn) => {
        btn.addEventListener("click", function () {
          const card = this.parentElement;
          card.style.opacity = "0.5";
          this.innerText = "Cancelled";
          this.disabled = true;
        });
      });

      // Edit profile (simple demo)
      document.querySelector(".edit-btn").addEventListener("click", () => {
        const name = prompt("Enter new name:");
        if (name) {
          document.getElementById("userName").innerText = name;
        }
      });
    </script>
  </body>
</html>
