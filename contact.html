<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Contact | Ethio Resort AI</title>
    <link rel="stylesheet" href="style.css" />

    <style>
      body {
        font-family: Arial;
        background: #f5f7fa;
      }

      .contact-container {
        max-width: 500px;
        margin: 60px auto;
        background: white;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      }

      h2 {
        text-align: center;
      }

      input,
      textarea {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        border: 1px solid #ccc;
        border-radius: 5px;
      }

      button {
        width: 100%;
        padding: 10px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      button:hover {
        background: #0056b3;
      }

      .success {
        margin-top: 10px;
        color: green;
        text-align: center;
      }

      .error {
        color: red;
        font-size: 13px;
      }
    </style>
  </head>

  <body>
    <div class="contact-container">
      <h2>Contact Us</h2>

      <form id="contactForm">
        <input type="text" id="name" placeholder="Your Name" />
        <div id="nameError" class="error"></div>

        <input type="email" id="email" placeholder="Your Email" />
        <div id="emailError" class="error"></div>

        <textarea id="message" rows="4" placeholder="Your Message"></textarea>
        <div id="messageError" class="error"></div>

        <button type="submit">Send Message</button>
      </form>

      <div id="successMsg" class="success"></div>
    </div>

    <script src="contact.js"></script>
  </body>
</html>
