<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Login</title>

    <style>
      body {
        font-family: Arial;
        background: #1e3a8a;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .box {
        background: white;
        padding: 30px;
        border-radius: 10px;
        width: 350px;
      }
      input,
      button {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
      }
      button {
        background: #3b82f6;
        color: white;
        border: none;
      }
      #errorMsg {
        color: red;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>Login</h2>

      <form id="loginForm">
        <input type="email" id="loginEmail" placeholder="Email" required />
        <input
          type="password"
          id="loginPassword"
          placeholder="Password"
          required
        />

        <button type="submit">Login</button>
      </form>

      <p id="errorMsg"></p>

      <p>No account? <a href="register.html">Register</a></p>
    </div>

    <script src="app.js"></script>
  </body>
</html>
