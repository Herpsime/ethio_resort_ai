<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Register</title>

    <style>
      body {
        font-family: Arial;
        background: #3b82f6;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .box {
        background: white;
        padding: 30px;
        border-radius: 10px;
        width: 350px;
      }
      input,
      button {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
      }
      button {
        background: #1e3a8a;
        color: white;
        border: none;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>Register</h2>

      <form id="registerForm">
        <input type="text" id="regName" placeholder="Name" required />
        <input type="email" id="regEmail" placeholder="Email" required />
        <input
          type="password"
          id="regPassword"
          placeholder="Password"
          required
        />

        <button type="submit">Register</button>
      </form>

      <p>Already have account? <a href="login.html">Login</a></p>
    </div>

    <script src="app.js"></script>
  </body>
</html>
